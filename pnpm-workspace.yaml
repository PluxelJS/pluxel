packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/eventure
  - vendor/pncat
  - vendor/split-like-vscode/packages/split-view
  - vendor/split-like-vscode/packages/react
  - vendor/split-like-vscode/packages/demo
  - projects/*
  - '!projects/host-expo'
  - projects/host-targets/plugins

allowBuilds:
  # Places the pinned platform binary at the PNPR executable entry.
  '@pnpm/pnpr@0.1.0-alpha.17': true
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false
  workerd: true

overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build
  # Use the same Base UI implementation throughout the documentation framework.
  fumadocs-ui: catalog:docs
  # Fumapress and direct Waku imports must share one RSC renderer.
  waku: catalog:docs
  # This declaration tool still requires the classic JS Compiler API.
  'dts-bundle-generator>typescript': 6.0.3
  typebox: catalog:dev

# Vite+ Core uses the Vite+ release number while exposing its bundled Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: '1.4.0'

publicHoistPattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'

trustPolicy: no-downgrade
trustPolicyExclude:
  # rc.5 has the same npm publisher as rc.0 and a verified registry signature, without trusted-publisher evidence.
  - 'elysia@2.0.0-rc.5'
trustPolicyIgnoreAfter: 43200
catalogs:
  # The vendored demo uses the same toolchain as Pluxel when run in this workspace.
  tooling:
    '@vitejs/plugin-react': ^6.2.1
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  backend:
