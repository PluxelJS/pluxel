trustPolicy: no-downgrade
trustPolicyExclude:
  # Elysia 2 rc.0 uses the same npm publisher as beta.26 and is signed by npm but was not published through the trusted-publisher path.
  # Keep this exact and remove it once the Elysia 2 release line restores publisher evidence.
  - 'elysia@2.0.0-rc.0'
trustPolicyIgnoreAfter: 43200
