packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/eventure
  - vendor/pncat
  - vendor/split-like-vscode/packages/core
  - vendor/split-like-vscode/packages/react
  - projects/*
  - projects/embedded-launcher/sdk

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build
  # Use the same Base UI implementation throughout the documentation framework.
  fumadocs-ui: catalog:docs
  # This declaration tool still requires the classic JS Compiler API.
  'dts-bundle-generator>typescript': 6.0.3
  typebox: catalog:dev

minimumReleaseAgeExclude:
  - '@logtape/file@2.3.8'
  - '@logtape/logtape@2.3.8'
  - '@logtape/pretty@2.3.8'
  - '@mantine/core@9.6.3'
  - '@mantine/dates@9.6.3'
  - '@mantine/hooks@9.6.3'
  - '@mantine/modals@9.6.3'
  - '@mantine/notifications@9.6.3'
  - '@mantine/store@9.6.3'
  - '@tanstack/query-core@5.104.0'
  - '@tanstack/react-query@5.104.0'
  - '@types/node@26.6.3'
  - '@rolldown/binding-android-arm-eabi@1.2.13'
  - '@rolldown/binding-android-arm64@1.2.13'
  - '@rolldown/binding-darwin-arm64@1.2.13'
  - '@rolldown/binding-darwin-x64@1.2.13'
  - '@rolldown/binding-freebsd-x64@1.2.13'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.13'
  - '@rolldown/binding-linux-arm64-gnu@1.2.13'
  - '@rolldown/binding-linux-arm64-musl@1.2.13'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.13'
  - '@rolldown/binding-linux-s390x-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-musl@1.2.13'
  - '@rolldown/binding-openharmony-arm64@1.2.13'
  - '@rolldown/binding-win32-arm64-msvc@1.2.13'
  - '@rolldown/binding-win32-x64-msvc@1.2.13'
  - rolldown@1.2.13
  - '@module-federation/vite@1.23.3'
  - elysia@2.0.0-beta.26
  - nf3@0.4.2

onlyBuiltDependencies:
  - esbuild

publicHoistPattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'
  - tsdown

trustPolicy: no-downgrade
trustPolicyExclude:
  # Elysia 2 beta.26 uses the same npm publisher as beta.7 and beta.19 and is signed by npm but was not published through the trusted-publisher path.
  # Keep this exact and remove it once the Elysia 2 release line restores publisher evidence.
  - 'elysia@2.0.0-beta.26'
trustPolicyIgnoreAfter: 43200
