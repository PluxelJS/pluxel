packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/split-like-vscode/packages/core
  - vendor/split-like-vscode/packages/react
  - projects/*

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build
  # Use the same Base UI implementation throughout the documentation framework.
  fumadocs-ui: catalog:docs
  # This declaration tool still requires the classic JS Compiler API.
  'dts-bundle-generator>typescript': 6.0.3
  # MF Vite 1.22.1 still pins 2.9.0; align its producer/runtime contract with the host.
  '@module-federation/vite>@module-federation/runtime': 2.9.1
  '@module-federation/vite>@module-federation/sdk': 2.9.1
  '@module-federation/vite>@module-federation/dts-plugin': 2.9.1
  typebox: catalog:dev

minimumReleaseAgeExclude:
  - '@logtape/file@2.3.8'
  - '@logtape/logtape@2.3.8'
  - '@logtape/pretty@2.3.8'
  - '@mantine/core@9.6.3'
  - '@mantine/dates@9.6.3'
  - '@mantine/hooks@9.6.3'
  - '@mantine/modals@9.6.3'
  - '@mantine/notifications@9.6.3'
  - '@mantine/store@9.6.3'
  - '@tanstack/query-core@5.104.0'
  - '@tanstack/react-query@5.104.0'
  - '@types/node@26.6.3'

onlyBuiltDependencies:
  - esbuild

publicHoistPattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'
  - tsdown

trustPolicy: no-downgrade
trustPolicyExclude:
  # Elysia 2 beta.19 uses the same npm publisher as beta.7 and is signed by npm but was not published through the trusted-publisher path.
  # Keep this exact and remove it once the Elysia 2 release line restores publisher evidence.
  - 'elysia@2.0.0-beta.19'
trustPolicyIgnoreAfter: 43200
