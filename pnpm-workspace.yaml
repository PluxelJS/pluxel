packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/split-like-vscode/packages/core
  - vendor/split-like-vscode/packages/react
  - projects/*
managePackageManagerVersions: false

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build

minimumReleaseAgeExclude:
  - '@pnpm/napi.darwin-arm64@12.0.0-rc.0'
  - '@pnpm/napi.darwin-x64@12.0.0-rc.0'
  - '@pnpm/napi.linux-arm64-musl@12.0.0-rc.0'
  - '@pnpm/napi.linux-arm64@12.0.0-rc.0'
  - '@pnpm/napi.linux-x64-musl@12.0.0-rc.0'
  - '@pnpm/napi.linux-x64@12.0.0-rc.0'
  - '@pnpm/napi.win32-arm64@12.0.0-rc.0'
  - '@pnpm/napi.win32-x64@12.0.0-rc.0'
  - '@pnpm/napi@12.0.0-rc.0'
  - elysia@2.0.0-beta.7
  - '@module-federation/vite@1.21.1'

onlyBuiltDependencies:
  - esbuild

publicHoistPattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'
  - tsdown

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@pnpm/napi@12.0.0-rc.0'
  # Elysia 2 beta.7 is signed by npm but was not published through the trusted-publisher path.
  # Keep this exact and remove it once the Elysia 2 release line restores publisher evidence.
  - 'elysia@2.0.0-beta.7'
  # Required Elysia 2 peer from the same maintainer and publishing path.
  - 'exact-mirror@1.2.4'
trustPolicyIgnoreAfter: 43200
