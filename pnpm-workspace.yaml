packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/eventure
  - vendor/pncat
  - vendor/split-like-vscode/packages/split-view
  - vendor/split-like-vscode/packages/react
  - vendor/split-like-vscode/packages/demo
  - projects/*

allowBuilds:
  # Places the pinned platform binary at the PNPR executable entry.
  '@pnpm/pnpr@0.1.0-alpha.17': true
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false
  workerd: true

overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build
  # Use the same Base UI implementation throughout the documentation framework.
  fumadocs-ui: catalog:docs
  # Fumapress and direct Waku imports must share one RSC renderer.
  waku: catalog:docs
  # This declaration tool still requires the classic JS Compiler API.
  'dts-bundle-generator>typescript': 6.0.3
  typebox: catalog:dev

# Vite+ Core uses the Vite+ release number while exposing its bundled Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: '1.4.0'

