packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/eventure
  - vendor/pncat
  - vendor/split-like-vscode/packages/core
  - vendor/split-like-vscode/packages/react
  - projects/*
  - projects/embedded-launcher/sdk

allowBuilds:
  electron: true
  koffi: true
  # Studio excludes just-bash archive commands; optional native codecs are unused.
  '@mongodb-js/zstd': false
  node-liblzma: false
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  react-server-dom-webpack: catalog:build
  # Use the same Base UI implementation throughout the documentation framework.
  fumadocs-ui: catalog:docs
  # This declaration tool still requires the classic JS Compiler API.
  'dts-bundle-generator>typescript': 6.0.3
  '@assistant-ui/react-streamdown>@streamdown/code': 2.0.0
  typebox: catalog:dev

# Vite+ Core uses the Vite+ release number while exposing its bundled Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: '1.4.0'

