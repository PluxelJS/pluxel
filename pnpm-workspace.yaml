packages:
  - packages/*
  - plugins/*
  - plugins/*/*
  - vendor/split-like-vscode/packages/core
  - vendor/split-like-vscode/packages/react
  - projects/*

catalog:
  '@chenglou/pretext': ^0.0.8
  '@dagrejs/dagre': ^3.1.1
  '@grpc/grpc-js': ^1.14.4
  '@napi-rs/canvas': ^1.0.3
  '@opentelemetry/api': ^1.9.0
  '@opentelemetry/api-logs': ^0.221.0
  '@opentelemetry/context-async-hooks': ^2.10.0
  '@opentelemetry/core': ^2.10.0
  '@opentelemetry/exporter-logs-otlp-grpc': ^0.221.0
  '@opentelemetry/exporter-logs-otlp-http': ^0.221.0
  '@opentelemetry/exporter-logs-otlp-proto': ^0.221.0
  '@opentelemetry/exporter-metrics-otlp-grpc': ^0.221.0
  '@opentelemetry/exporter-metrics-otlp-http': ^0.221.0
  '@opentelemetry/exporter-metrics-otlp-proto': ^0.221.0
  '@opentelemetry/exporter-prometheus': ^0.221.0
  '@opentelemetry/exporter-trace-otlp-grpc': ^0.221.0
  '@opentelemetry/exporter-trace-otlp-http': ^0.221.0
  '@opentelemetry/exporter-trace-otlp-proto': ^0.221.0
  '@opentelemetry/resources': ^2.10.0
  '@opentelemetry/sdk-logs': ^0.221.0
  '@opentelemetry/sdk-metrics': ^2.10.0
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@pnpm/napi': 12.0.0-rc.0
  '@mantine/core': ^9.5.2
  '@mantine/dates': ^9.5.2
  '@mantine/hooks': ^9.5.2
  '@mantine/modals': ^9.5.2
  '@mantine/notifications': ^9.5.2
  '@pluxel/market': ^0.1.0
  '@tabler/icons-react': ^3.37.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  drizzle-orm: ^0.45.2
  echarts: ^6.1.0
  react: ^19.2.8
  react-dom: ^19.2.8
  redis: ^6.1.0
  s3mini: ^1.0.0
  takumi-js: ^2.12.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  undici: ^7.16.0
  vitest: ^4.1.10
  wretch: ^3.0.9
  yaml: ^2.8.2
managePackageManagerVersions: false

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@pnpm/napi.darwin-arm64@12.0.0-rc.0'
  - '@pnpm/napi.darwin-x64@12.0.0-rc.0'
  - '@pnpm/napi.linux-arm64-musl@12.0.0-rc.0'
  - '@pnpm/napi.linux-arm64@12.0.0-rc.0'
  - '@pnpm/napi.linux-x64-musl@12.0.0-rc.0'
  - '@pnpm/napi.linux-x64@12.0.0-rc.0'
  - '@pnpm/napi.win32-arm64@12.0.0-rc.0'
  - '@pnpm/napi.win32-x64@12.0.0-rc.0'
  - '@pnpm/napi@12.0.0-rc.0'
  - elysia@2.0.0-beta.7
  - '@module-federation/vite@1.21.1'

onlyBuiltDependencies:
  - esbuild

public-hoist-pattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'
  - tsdown

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@pnpm/napi@12.0.0-rc.0'
  # Elysia 2 beta.7 is signed by npm but was not published through the trusted-publisher path.
  # Keep this exact and remove it once the Elysia 2 release line restores publisher evidence.
  - 'elysia@2.0.0-beta.7'
  # Required Elysia 2 peer from the same maintainer and publishing path.
  - 'exact-mirror@1.2.4'
trustPolicyIgnoreAfter: 43200
