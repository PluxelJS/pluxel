packages:
  - packages/*
  - packages/plugins/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

minimumReleaseAgeExclude:
  - '@gqlens/codegen@0.2.0'
  - '@gqlens/core@0.2.0'
  - '@gqlens/react@0.2.0'
  - '@gqlens/vite@0.2.0'

onlyBuiltDependencies:
  - esbuild

public-hoist-pattern:
  - react
  - react-dom
  - '@tabler/icons-react'
  - '@mantine/core'
  - '@mantine/hooks'
  - '@mantine/dates'
  - '@mantine/modals'
  - '@mantine/notifications'
  - tsdown

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
