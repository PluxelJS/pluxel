name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Update CLA status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == '/approve-cla' || github.event.action != 'created'))
    steps:
      - name: Checkout protected CLA policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Check CLA
        run: node scripts/check-cla.mjs github
        env:
          GITHUB_TOKEN: ${{ github.token }}
