name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'
  PLUXEL_FAST_BUILD: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          install: true

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency and Turbo caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            .turbo
          key: ${{ runner.os }}-pnpm-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pnpm-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-pnpm-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        run: pnpm run release:check

      - name: Build and test
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run build test "--filter=...[origin/${BASE_REF}]"
          else
            pnpm exec turbo run build test
          fi
