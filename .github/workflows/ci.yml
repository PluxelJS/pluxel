name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_CONFIG_PM_ON_FAIL: 'ignore'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: true

      - name: Validate workspace tool configuration
        run: |
          hk validate
          pitchfork daemons --json

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-store-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ runner.os }}-pnpm-files-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-files-v3-

      - name: Install dependencies
        id: install
        run: vp install --frozen-lockfile

      - name: Restore Vite task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          # Cache entries are immutable. Give every attempt its own key so a failed run can save
          # partial Vite task results without preventing a rerun from publishing the completed cache.
          key: ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}-
            ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vp-task-v1-

      - name: Verify repository
        id: task-verify
        env:
          PLUXEL_REDIS_TEST_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          node -e 'const os = require("node:os"); console.log(`Runner: ${os.availableParallelism()} CPUs, ${Math.round(os.totalmem() / 1024 ** 3)} GiB RAM; 2 concurrent package tasks`)'
          # Explicit task dependencies handle publishing cycles; cache unchanged work.
          vp run --concurrency-limit=2 -v workspace:ci

      - name: Capture Vite task execution details
        if: always() && steps.task-verify.outcome != 'skipped'
        run: |
          mkdir -p .pluxel
          vp run --last-details > .pluxel/ci-task-details.txt

      - name: Upload task timings and cache results
        if: always() && steps.task-verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ci-task-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pluxel/ci-task-details.txt
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Save Vite task cache
        if: always() && steps.task-cache.outcome == 'success' && steps.task-verify.outcome != 'skipped' && steps.task-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Save pnpm store
        if: always() && steps.install.outcome == 'success' && steps.pnpm-store-cache.outcome == 'success' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
