name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_CONFIG_PM_ON_FAIL: 'ignore'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          install: true

      - name: Validate workspace tool configuration
        run: |
          hk validate
          pitchfork daemons --json

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ runner.os }}-pnpm-files-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-files-v3-

      - name: Install dependencies
        id: install
        run: vp install --frozen-lockfile

      - name: Restore Vite task cache
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          # Cache entries are immutable. Give every attempt its own key so a failed run can save
          # partial Vite task results without preventing a rerun from publishing the completed cache.
          key: ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}-
            ${{ runner.os }}-vp-task-v1-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vp-task-v1-

      - name: Install Typst native toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Restore Typst native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/render/typst/native/.build
          key: ${{ runner.os }}-x64-typst-rust-1.97.1-${{ hashFiles('plugins/render/typst/native/build.mjs', 'plugins/render/typst/native/*.patch', 'plugins/render/typst/native/*.rs') }}

      - name: Verify repository
        id: task-verify
        env:
          PLUXEL_REDIS_TEST_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          node -e 'const os = require("node:os"); console.log(`Runner: ${os.availableParallelism()} CPUs, ${Math.round(os.totalmem() / 1024 ** 3)} GiB RAM; 2 concurrent package tasks`)'
          # Explicit native task dependencies handle publishing cycles; cache unchanged work.
          vp run verify --concurrency-limit=2 -v

      - name: Capture Vite task execution details
        if: always() && steps.task-verify.outcome != 'skipped'
        run: |
          mkdir -p .pluxel
          vp run --last-details > .pluxel/ci-task-details.txt

      - name: Upload task timings and cache results
        if: always() && steps.task-verify.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-task-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pluxel/ci-task-details.txt
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Save Vite task cache
        if: always() && steps.task-cache.outcome == 'success' && steps.task-verify.outcome != 'skipped' && steps.task-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Save pnpm store
        if: always() && steps.install.outcome == 'success' && steps.pnpm-store-cache.outcome == 'success' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
