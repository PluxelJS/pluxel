name: Typst Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-template-studio-windows.yml'
      - 'projects/report-template-studio/**'
      - 'plugins/render/typst/**'
      - 'plugins/render/fonts/**'
      - 'packages/core/**'
      - 'packages/context/**'
      - 'packages/host/**'
      - 'packages/host-vite/**'
      - 'packages/services/**'
      - 'packages/rolldown/**'
      - 'packages/commands/**'
      - 'packages/valibot-form/**'
      - 'packages/workbench/**'
      - 'packages/cli/**'
      - 'vendor/eventure/**'
      - 'vendor/split-like-vscode'
      - 'mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: typst-studio-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_CONFIG_PM_ON_FAIL: 'ignore'

jobs:
  package:
    name: Windows x64 portable application
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install workspace toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: true

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ runner.os }}-pnpm-files-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-files-v3-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify private discovery directory and descriptors
        run: vp run @report-template-studio/app#check-discovery

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Restore native compiler build cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: plugins/render/typst/native/.build
          key: ${{ runner.os }}-x64-studio-typst-rust-1.97.1-${{ hashFiles('plugins/render/typst/native/build.mjs', 'plugins/render/typst/native/*.patch', 'plugins/render/typst/native/*.rs') }}

      - name: Build native compiler
        run: vp run @pluxel/typst#prepare:native

      - name: Save native compiler build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: plugins/render/typst/native/.build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Check and build Studio
        run: |
          vp run @report-template-studio/app#compile
          vp run @report-template-studio/app#check-types

      - name: Verify template compiler syntax diagnostics and HMR
        run: vp test run --config vite.config.ts projects/report-template-studio/tests/compiler.test.ts

      - name: Package current Windows architecture
        run: vp run @report-template-studio/app#package

      - name: Verify packaged runtime with named pipe and no TCP/HTTP listener
        run: vp run @report-template-studio/app#test:runtime
        env:
          STUDIO_APP_ROOT: ${{ github.workspace }}/projects/report-template-studio/release/PluxelTypstStudio-win32-x64/resources/app

      - name: Archive portable application
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'projects/report-template-studio/release'
          $archive = Join-Path $release 'PluxelTypstStudio-win32-x64.zip'
          # System bsdtar includes .agents skills; Compress-Archive skips hidden files.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $archive -C $release PluxelTypstStudio-win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'Studio archive failed' }

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: PluxelTypstStudio-win32-x64-${{ github.sha }}
          path: projects/report-template-studio/release/PluxelTypstStudio-win32-x64.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
