name: Core Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/context/**'
      # Test and documentation edits do not change the measured runtime or workload.
      - '!packages/core/tests/**'
      - '!packages/context/tests/**'
      - '!packages/core/**/*.test.*'
      - '!packages/context/**/*.test.*'
      - '!packages/core/**/*.spec.*'
      - '!packages/context/**/*.spec.*'
      - '!packages/core/**/*.md'
      - '!packages/context/**/*.md'
      - 'scripts/core-bench-compare.sh'
      - 'scripts/core-bench-reference-bridge.mjs'
      - 'scripts/core-bench-node-runner.mjs'
      - 'pnpm-lock.yaml'
      - 'turbo.jsonc'
      - '.github/workflows/core-bench.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/context/**'
      # Test and documentation edits do not change the measured runtime or workload.
      - '!packages/core/tests/**'
      - '!packages/context/tests/**'
      - '!packages/core/**/*.test.*'
      - '!packages/context/**/*.test.*'
      - '!packages/core/**/*.spec.*'
      - '!packages/context/**/*.spec.*'
      - '!packages/core/**/*.md'
      - '!packages/context/**/*.md'
      - 'scripts/core-bench-compare.sh'
      - 'scripts/core-bench-reference-bridge.mjs'
      - 'scripts/core-bench-node-runner.mjs'
      - 'pnpm-lock.yaml'
      - 'turbo.jsonc'
      - '.github/workflows/core-bench.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit/ref to compare against (defaults to previous push commit or merge-base with default branch)'
        type: string
        required: false
      fail_on_regression:
        description: 'Fail workflow when regression exceeds tolerance'
        type: boolean
        default: false

env:
  BENCH_TOLERANCE: '5'
  PNPM_CONFIG_PM_ON_FAIL: 'ignore'

concurrency:
  group: core-bench-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.event.inputs.base_ref || github.event.pull_request.base.sha || github.event.before }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$BASE_BRANCH"

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          cache: true
          install: true

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          # The pnpm store is content-addressed; commit-specific keys only duplicate the same cache.
          key: ${{ runner.os }}-pnpm-files-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-files-v3-

      - name: Run base/head benchmark comparison
        id: benchmark
        env:
          PLUXEL_BENCH_COMPARE_BASE: ${{ env.BASE_REF }}
          PLUXEL_BENCH_COMPARE_HEAD: ${{ env.HEAD_REF }}
          PLUXEL_BENCH_DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          PLUXEL_BENCH_TOLERANCE: ${{ env.BENCH_TOLERANCE }}
          PLUXEL_BENCH_STRICT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_regression == 'true' && '1' || '0' }}
        run: pnpm bench:core:compare

      - name: Save dependency cache
        if: always() && steps.benchmark.outcome == 'success' && steps.pnpm-store-cache.outcome == 'success' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

      - name: Upload benchmark artifacts
        if: always() && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-bench-run-${{ github.run_id }}
          path: |
            .bench-results/core/base/plugin-lifecycle.json
            .bench-results/core/base/plugin-lifecycle.bridged.json
            .bench-results/core/base/plugin-lifecycle.md
            .bench-results/core/base/install.log
            .bench-results/core/base/bench.log
            .bench-results/core/head/plugin-lifecycle.json
            .bench-results/core/head/plugin-lifecycle.md
            .bench-results/core/head/install.log
            .bench-results/core/head/bench.log
            .bench-results/core/bridge-legacy/plugin-lifecycle.json
            .bench-results/core/bridge-legacy/plugin-lifecycle.md
            .bench-results/core/bridge-legacy/install.log
            .bench-results/core/bridge-legacy/bench.log
            .bench-results/core/bridge-current/plugin-lifecycle.json
            .bench-results/core/bridge-current/plugin-lifecycle.md
            .bench-results/core/bridge-current/install.log
            .bench-results/core/bridge-current/bench.log
          include-hidden-files: true
          if-no-files-found: error

      - name: Report benchmark results
        if: always() && steps.benchmark.outcome != 'skipped'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          BASE_REF: ${{ env.BASE_REF }}
          HEAD_REF: ${{ env.HEAD_REF }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const marker = '<!-- pluxel-core-bench -->'
            const reportPath = path.join(process.cwd(), '.bench-results/core/head/plugin-lifecycle.md')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : `Benchmark ${process.env.BENCHMARK_OUTCOME}: comparison stopped before the head report was generated. See [run logs and partial benchmark artifacts](${runUrl}) for the failing stage.`
            body = [
              marker,
              `Same runner: base \`${process.env.BASE_REF}\` -> head \`${process.env.HEAD_REF}\`.`,
              '',
              body,
            ].join('\n')
            await core.summary.addRaw(body).write()

            // Fork pull requests have read-only tokens. Their report remains available in the
            // job summary and artifacts without moving benchmark code into a trusted trigger.
            const pullRequest = context.payload.pull_request
            if (!pullRequest || pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) return

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            try {
              const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
              const existing = comments.data.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
            } catch (error) {
              // Dependabot and repository policy may restrict even a same-repository token.
              // Comment permission does not determine whether the benchmark passed.
              if (error.status !== 403) throw error
              core.warning('PR comment permission is unavailable; benchmark results are in the job summary and artifacts.')
            }
