name: Core Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/build/**'
      - 'scripts/core-bench-compare.sh'
      - 'pnpm-lock.yaml'
      - '.github/workflows/core-bench.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/build/**'
      - 'scripts/core-bench-compare.sh'
      - 'pnpm-lock.yaml'
      - '.github/workflows/core-bench.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit/ref to compare against (defaults to previous push commit or merge-base with default branch)'
        type: string
        required: false
      fail_on_regression:
        description: 'Fail workflow when regression exceeds tolerance'
        type: boolean
        default: false

env:
  BENCH_TOLERANCE: '5'

concurrency:
  group: core-bench-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.event.inputs.base_ref || github.event.pull_request.base.sha || github.event.before }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$BASE_BRANCH"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install: 'false'

      - name: Run base/head benchmark comparison
        env:
          PLUXEL_BENCH_COMPARE_BASE: ${{ env.BASE_REF }}
          PLUXEL_BENCH_COMPARE_HEAD: ${{ env.HEAD_REF }}
          PLUXEL_BENCH_DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          PLUXEL_BENCH_TOLERANCE: ${{ env.BENCH_TOLERANCE }}
          PLUXEL_BENCH_STRICT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_regression == 'true' && '1' || '0' }}
        run: pnpm bench:core:compare

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-bench-run-${{ github.run_id }}
          path: |
            .bench-results/core/base/plugin-lifecycle.json
            .bench-results/core/base/plugin-lifecycle.md
            .bench-results/core/base/install.log
            .bench-results/core/base/bench.log
            .bench-results/core/head/plugin-lifecycle.json
            .bench-results/core/head/plugin-lifecycle.md
            .bench-results/core/head/install.log
            .bench-results/core/head/bench.log
          if-no-files-found: error

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BASE_REF: ${{ env.BASE_REF }}
          HEAD_REF: ${{ env.HEAD_REF }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const marker = '<!-- pluxel-core-bench -->'
            const reportPath = path.join(process.cwd(), '.bench-results/core/head/plugin-lifecycle.md')
            let body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Benchmark report not found.'
            body = [
              marker,
              `Same runner: base \`${process.env.BASE_REF}\` -> head \`${process.env.HEAD_REF}\`.`,
              '',
              body,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            const existing = comments.data.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
