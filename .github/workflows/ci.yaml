name: "  ▶️  CI Workflow"

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - ".vscode/**"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: pull-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "lts/*"
  BUN_VERSION: "1.2.22"

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ["lts/*"]
        bun: ["1.2.22"]

    name: "Build: ${{ matrix.os }}, Node.js ${{ matrix.node }}, Bun ${{ matrix.bun }}"

    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🛠️ Setup toolchain"
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
          bun-version: ${{ matrix.bun }}  # ← 这行启用 Bun（你的 composite 会自动安装并缓存）

      # PR：只跑受影响的包（相对 base 分支）
      - name: "🧪 Test (affected only)"
        if: github.event_name == 'pull_request'
        run: pnpm -w turbo run test --filter=...[origin/${{ github.base_ref }}]

      # main：全量跑（利用 turbo 缓存，未变的会秒跳过）
      - name: "🧪 Test (full, cached)"
        if: github.ref == 'refs/heads/main'
        run: pnpm -w turbo run test

      # 其它分支（可选）：也跑受影响包
      - name: "🧪 Test (affected only, other branches)"
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: pnpm -w turbo run test --filter=...[origin/main]
