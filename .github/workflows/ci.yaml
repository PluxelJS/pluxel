name: "▶️ CI Workflow"

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - ".vscode/**"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "lts/*"
  BUN_VERSION: "1.2.22"

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["lts/*"]
        bun: ["1.2.22"]

    name: "Tests · ${{ matrix.os }} · Node ${{ matrix.node }} · Bun ${{ matrix.bun }}"

    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🛠️ Setup toolchain"
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
          bun-version: ${{ matrix.bun }}

      - name: "🧭 Determine test scope"
        id: scope
        env:
          DEFAULT_BASE: main
          PR_BASE_REF: ${{ github.base_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail

          current_ref="$GITHUB_REF"

          # Always run full suite on main to keep cache warm and surface regressions.
          if [ "$current_ref" = "refs/heads/main" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_branch="${PR_BASE_REF:-}"
          if [ -z "$base_branch" ]; then
            base_branch="$DEFAULT_BASE"
          fi

          base_sha="origin/$base_branch"

          git fetch --no-tags --depth=1 origin "$base_branch:$base_branch" >/dev/null 2>&1 || true

          tmpfile="$(mktemp)"
          cleanup() { rm -f "$tmpfile"; }
          trap cleanup EXIT

          if pnpm -w turbo run test --filter=...[$base_sha] --dry-run=json >"$tmpfile" 2>/dev/null; then
            tasks=$(jq '.tasks | length' "$tmpfile")
            if [ "$tasks" -gt 0 ]; then
              echo "mode=affected" >> "$GITHUB_OUTPUT"
              echo "filter_ref=$base_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "mode=full" >> "$GITHUB_OUTPUT"

      - name: "🧪 Run tests"
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ steps.scope.outputs.mode }}"
          filter_ref="${{ steps.scope.outputs.filter_ref }}"

          if [ "$mode" = "affected" ] && [ -n "$filter_ref" ]; then
            echo "Running affected tests against $filter_ref"
            pnpm -w turbo run test --filter=...[$filter_ref]
          else
            echo "Running full test suite"
            pnpm -w turbo run test
          fi
