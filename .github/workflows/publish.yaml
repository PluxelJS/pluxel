name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # ← 必须是 write，provenance 需要 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true  # 自动安装依赖（等价 pnpm i）

      # 用官方 setup-node，顺手配置 npm registry & auth
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true  # 自动安装依赖（等价 pnpm i）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          check-latest: true

      - name: Build
        run: pnpm build

      # 递归发布：只会发布非 private 且未发过该 version 的包
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}  # npm 的 token（Automation）
        run: |
          # 确保 provenance 生效（也可直接在命令行加 --provenance）
          npm config set provenance false
          # 避免 git 状态检查导致中断（CI 常用）
          pnpm -r publish --access public --no-git-checks
