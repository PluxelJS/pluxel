version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /packages/create/template/.github/workflows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-template:
        patterns:
          - '*'
