name: 'Setup (Node.js)'
description: 'Setup Node.js, pnpm, and optional Bun'

inputs:
  node-version:
    description: 'Node.js version'
    required: true
    default: 'lts'
  pnpm-version:
    description: 'pnpm version'
    required: true
    default: 'latest'
  bun-version:
    description: 'Bun version (optional). Set to "latest" or a semver to enable.'
    required: false
    default: '' # empty = skip bun

runs:
  using: 'composite'
  steps:
    - name: '🔧 Install: pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
        standalone: true
        dest: ~/setup-pnpm

    # 🔺 Turbo 缓存（用锁文件哈希提升命中率）
    - name: '🔺️ Cache (turbo)'
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-

    - name: '💽️ Setup Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        registry-url: 'https://registry.npmjs.org'

    # 🍞 Bun（可选启用）
    - name: '🍞 Setup Bun'
      if: ${{ inputs.bun-version != '' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: '🍞 Cache (bun)'
      if: ${{ inputs.bun-version != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/bun
        key: bun-${{ runner.os }}-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lockb') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.bun-version }}-
          bun-${{ runner.os }}-

    - name: '📦️ Install Dependencies'
      shell: bash
      run: pnpm install --frozen-lockfile
