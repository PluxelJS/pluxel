core:changelogs:
  - content: "---\npackages:\n  \"@pluxel/rolldown\":\n    type: patch\n  \"@pluxel/runtime-static\":\n    type: patch\n---\n\n## Recover Workbench definition hot updates across edits, failures and file replacement\n\nRefresh standalone Workbench definitions and imported helpers within the same semantic generation as Plugin facts. Reject superseded transforms, discard failed parsing work, withdraw deleted publications, and preserve committed facts when a candidate is rejected. Generated Bridge and renderer projection files now use revision-specific paths.\n\nStatic Vite development handles file creation and deletion through the same update queue as edits, allowing recreated definitions and their dependent plugins to recover without restarting dev.\n"
    filename: workbench-hmr-generations.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime\":\n    type: minor\n---\n\n## Align development console polymorphism with test hosts\n\nAdd dependency inspection and default/consumer provider selection, persistent fork creation and removal, and synchronous running-state queries to the development console. Abstract requirements and typed fork targets use the existing identity and lifecycle rules; mutations return production domain results and application reports.\n"
    filename: dev-console-polymorphism.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime\":\n    type: minor\n  \"@pluxel/runtime-static\":\n    type: patch\n  \"@pluxel/runtime-dynamic\":\n    type: patch\n---\n\n## Recover failed candidates without mixing runtime and Workbench generations\n\nPrepare Workbench artifacts before catalog acceptance and activate them at the graph commit boundary. Rejected candidates preserve the running generation's Content and producer builds; superseded background validations cannot publish.\n\nStatic Vite retains failed-candidate recovery dependencies independently of the committed graph, including new files, missing imports and package installation metadata. Fixing those dependencies automatically retries the candidate and restores dependent plugins.\n\nManagement clients can read and subscribe to independent update attempts. Workbench displays batch progress and bounded failure details in its header, preserving the distinction between rejected updates and current plugin health. Revoked Workbench sessions automatically reload the document after cleanup, with a bounded retry interval and manual fallback for repeated refreshes or authentication failures.\n"
    filename: hmr-recovery-and-workbench-refresh.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime\":\n    type: minor\n---\n\n## Retain and expose Plugin lifecycle failures\n\nPlugin status and management commands include lifecycle failure codes and messages until recovery or removal, including across unrelated commits. Runtime logs record the affected Plugin, phase and serialized error. Workbench distinguishes startup failures and dependency blocking from pending activation, keeps error notifications open, and lets users copy the notification and full lifecycle report. PGlite initialization errors identify the data directory and explain why retrying a Plugin cannot recreate a failed shared backend.\n"
    filename: plugin-lifecycle-diagnostics.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime\":\n    type: minor\n---\n\n## Prefer declared Workbench route paths and diagnose collisions\n\nWorkbench exposes all committed routes in its global layout, including parameterized routes and pages outside navigation. The Shell uses declared paths below its UI base URL when unambiguous. Overlapping routes from different plugin instances and reserved Shell paths use canonical plugin URLs with visible collision diagnostics. Canonical URLs remain available, and aliases are recomputed after publication changes.\n"
    filename: workbench-readable-routes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime\":\n    type: patch\n---\n\n## Fill the available Workbench space for federated pages\n\nGive federated View and Attachment renderers a sized mount container. Pages now fill their editor pane instead of shrinking to their content width, and Pane Kit responds to the actual available width when choosing columns or drawers.\n"
    filename: workbench-view-fill.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@pluxel/runtime-static\":\n    type: patch\n---\n\n## Restore HMR after installing a missing package\n\nKeep recovery watches active when package resolution searches overlapping ancestor directories, so installing a previously missing dependency automatically retries the failed application update.\n"
    filename: hmr-package-install-watch.md
    v: 0.0.0
  - content: "---\npackages:\n  valibot-form:\n    type: patch\n---\n\n## Preserve scroll position when focusing collection inputs\n\nArray and record draft inputs retain keyboard focus without scrolling their containing panels or the page when the form renders or entries change.\n"
    filename: form-focus-scroll.md
    v: 0.0.0
  - content: "---\npackages:\n  valibot-form:\n    type: patch\n---\n\n## Share resolved defaults across the form\n\nSchema defaults are resolved once for the controls, form context and reset, keeping values from dynamic default factories consistent. An explicit `defaultValues: undefined` uses schema defaults just like an omitted option.\n"
    filename: valibot-form-defaults.md
    v: 0.0.0
  - content: "---\npackages:\n  valibot-form:\n    type: patch\n---\n\n## Bind nested form fields to TanStack paths\n\nObject, array, union and record editors now bind addressable child fields directly to TanStack Form, preserving independent interaction metadata and field errors. Array operations use TanStack metadata handling; reset also clears local collection drafts and inactive union values, including resets invoked from submission callbacks.\n\nWorkbench config and Content action forms display server errors at mounted field paths, retain unaddressable issues in a summary, and permit correction and retry. Inputs associate field errors with their accessible descriptions.\n\nUnion and Record leaf edits avoid rerendering unchanged sibling controls. Picklist options use Mantine's current render callback, and multi-value picker errors use Mantine's input wrapper to associate the actual input with its error message.\n\nLiteral record keys retain their original meaning. Unaddressable top-level keys are shown as read-only instead of writing to an incorrect nested path; their original values remain in submitted data.\n"
    filename: valibot-form-nested-binding.md
    v: 0.0.0
