[tools]
node = "24.21.0"
pnpm = "11.28.2"
hk = "2.6.0"
pitchfork = "2.30.1"
viteplus = "1.2.0"

[env]
_.path = ["node_modules/.bin"]
PNPM_CONFIG_PM_ON_FAIL = "ignore"

[tasks.setup]
description = "Install workspace dependencies"
run = "vp install"

[tasks."hooks:install"]
description = "Install hk hooks in an initialized Git repository"
run = "hk install --mise"

[tasks.dev]
description = "Start the application with Pitchfork"
run = "pitchfork start plugin-host"

[tasks.check]
description = "Check changed files with hk"
run = "hk check"

[tasks.fix]
description = "Fix changed files with hk"
run = "hk fix"

[tasks.verify]
description = "Run complete workspace verification"
run = "vp run verify"

[tasks.docs]
description = "Start the documentation service with Pitchfork"
run = "pitchfork start docs"
