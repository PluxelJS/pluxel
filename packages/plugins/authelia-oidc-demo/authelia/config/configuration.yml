# Demo-only Authelia config for packages/plugins/authelia-oidc-demo.
# Credentials are intentionally simple:
# - user: demo / password
# - both OIDC clients: client_secret=password
#
# This uses SQLite through storage.local.path and must not be reused for production.

theme: auto

server:
  address: tcp://:9091/

log:
  level: debug

totp:
  issuer: pluxel-authelia-oidc-demo

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: one_factor

session:
  secret: pluxel_demo_session_secret_change_me_64_chars_for_real_deployments
  cookies:
    - name: authelia_session
      domain: 127.0.0.1
      authelia_url: http://127.0.0.1:9091
      default_redirection_url: http://127.0.0.1:3310

storage:
  encryption_key: pluxel_demo_storage_encryption_key_change_me_64_chars_for_real_deployments
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

identity_validation:
  reset_password:
    jwt_secret: pluxel_demo_reset_password_jwt_secret_change_me_64_chars_for_real_deployments

identity_providers:
  oidc:
    hmac_secret: pluxel_demo_oidc_hmac_secret_change_me_64_chars_for_real_deployments
    jwks:
      - key: |
          {{- fileContent "/config/oidc.private.pem" | nindent 10 }}
    clients:
      - client_id: pluxel-host-verification
        client_name: Pluxel Host Verification
        client_secret: '$argon2id$v=19$m=65536,t=3,p=4$Hjc7UQKiayw7pk6XNHWh1Q$u+UfWRZEqAWlw7yyYn8fBZ4/JIxQ2EnJOFXtUz3e0vg'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - http://127.0.0.1:3310/security
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
        response_types:
          - code
        token_endpoint_auth_method: client_secret_basic

      - client_id: pluxel-business-demo
        client_name: Pluxel Business OIDC Demo
        client_secret: '$argon2id$v=19$m=65536,t=3,p=4$Hjc7UQKiayw7pk6XNHWh1Q$u+UfWRZEqAWlw7yyYn8fBZ4/JIxQ2EnJOFXtUz3e0vg'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - http://127.0.0.1:3310/__pluxel/plugins/AutheliaOidcDemoPlugin/authelia-oidc-demo/business/callback
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
        response_types:
          - code
        token_endpoint_auth_method: client_secret_basic
