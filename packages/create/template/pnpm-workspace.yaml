packages:
  - host
  - host/web
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    elysia: 2.0.0-beta.19
    typebox: 1.3.23
  frontend:
    '@mantine/core': ^9.6.3
    '@mantine/hooks': ^9.6.3
    '@tabler/icons-react': ^3.48.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.1
    # Match the exact React singleton used by the published Workbench artifacts.
    react: 19.3.0
    react-dom: 19.3.0
  pluxel:
    '@pluxel/cli': ^1.0.0
    '@pluxel/core': ^1.0.0
    '@pluxel/commands': ^1.0.0
    '@pluxel/host': ^0.1.0
    '@pluxel/services': ^0.1.0
    '@pluxel/workbench': ^0.1.0
    '@pluxel/rolldown': ^1.0.0
    '@pluxel/vault-admin': ^1.0.0
    '@pluxel/host-dev': ^1.0.0
    '@pluxel/test': ^1.0.0
  validation:
    valibot: ^1.5.0
  test:
    vitest: 5.0.2
  tooling:
    '@types/node': ^26.6.3
    oxfmt: ^0.70.0
    oxlint: ^1.85.0
    pncat: ^0.13.4
    portless: 0.15.6
    tsdown: ^0.23.0
    turbo: ^2.11.4
    typescript: ^7.0.2
    vite: ^8.3.1
overrides:
  typebox:
    # Elysia 2 beta.19 eager compilation uses Validator.buildResult, removed in TypeBox 1.3.24.
    # Remove this pin when Elysia supports the newer Validator contract.
    catalog:backend
