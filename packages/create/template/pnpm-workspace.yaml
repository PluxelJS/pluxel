packages:
  - host
  - host/web
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    '@sinclair/typebox': ^0.34.52
    exact-mirror: ^1.2.6
    elysia: 2.0.0-beta.26
    typebox: ^1.3.36
  frontend:
    '@mantine/core': 9.7.1
    '@mantine/hooks': 9.7.1
    '@tabler/icons-react': ^3.49.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    # Source installation aligns the physical React singleton with the Workbench host.
    react: ^19.3.0
    react-dom: ^19.3.0
  pluxel:
    '@pluxel/cli': ^1.0.0
    '@pluxel/core': ^1.0.0
    '@pluxel/commands': ^1.0.0
    '@pluxel/host': ^0.1.0
    '@pluxel/services': ^0.1.0
    '@pluxel/workbench': ^0.1.0
    '@pluxel/rolldown': ^1.0.0
    '@pluxel/host-vite': ^1.0.0
    '@pluxel/test': ^1.0.0
  validation:
    valibot: ^1.5.0
  test:
    vitest: ^5.0.3
  tooling:
    '@types/node': ^26.6.4
    oxfmt: ^0.72.0
    oxlint: ^1.87.0
    portless: ^0.15.7
    tsdown: ^0.23.0
    turbo: ^2.11.7
    typescript: ^7.0.2
    vite: ^8.3.3
overrides:
  typebox: catalog:backend

# Verified registry signature and publisher match the previous Elysia 2 beta.
trustPolicyExclude:
  - elysia@2.0.0-beta.26
