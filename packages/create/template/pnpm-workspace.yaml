packages:
  - host
  - host/web
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

catalogs:
  backend:
    '@sinclair/typebox': ^0.34.52
    exact-mirror: ^1.2.6
    elysia: 2.0.0-beta.26
    typebox: ^1.3.36
  frontend:
    '@mantine/core': 9.7.1
    '@mantine/hooks': 9.7.1
    '@tabler/icons-react': ^3.49.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    # Source installation aligns the physical React singleton with the Workbench host.
    react: ^19.3.0
    react-dom: ^19.3.0
  pluxel:
    '@pluxel/cli': ^1.0.0
    '@pluxel/core': ^1.0.0
    '@pluxel/commands': ^1.0.0
    '@pluxel/host': ^0.1.0
    '@pluxel/services': ^0.1.0
    '@pluxel/workbench': ^0.1.0
    '@pluxel/rolldown': ^1.0.0
    '@pluxel/host-vite': ^1.0.0
    '@pluxel/test': ^1.0.0
  validation:
    valibot: ^1.5.0
  test:
    vitest: 5.0.4
  tooling:
    vite-plus: 1.2.0
    '@types/node': ^26.6.4
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.2.0
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.2.0
  typebox: catalog:backend

# Verified registry signature and publisher match the previous Elysia 2 beta.
trustPolicyExclude:
  - elysia@2.0.0-beta.26

# Vite+ Core uses its own version while bundling the compatible Vite engine.
peerDependencyRules:
  allowedVersions:
    vite: 1.2.0
