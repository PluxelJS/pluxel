packages:
  - host
  - host/web
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true

managePackageManagerVersions: false
catalogs:
  backend:
    elysia: 2.0.0-beta.7
  frontend:
    '@mantine/core': ^9.5.2
    '@mantine/hooks': ^9.5.2
    '@tabler/icons-react': ^3.37.1
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5
    '@vitejs/plugin-react': ^6.1.1
    react: ^19.2.8
    react-dom: ^19.2.8
  pluxel:
    '@pluxel/cli': ^1.0.0
    '@pluxel/core': ^1.0.0
    '@pluxel/rolldown': ^1.0.0
    '@pluxel/runtime': ^1.0.0
    '@pluxel/runtime-dynamic': ^1.0.0
    '@pluxel/runtime-static': ^1.0.0
    '@pluxel/test': ^1.0.0
  test:
    vitest: 5.0.0
  tooling:
    '@types/node': ^25.0.0
    oxfmt: ^0.58.0
    oxlint: ^1.73.0
    pncat: ^0.12.0
    tsdown: ^0.22.14
    turbo: ^2.10.4
    typescript: ^6.0.3
    vite: ^8.2.2
