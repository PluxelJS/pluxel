name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
      - run: hk validate
      - run: pitchfork daemons --json
      - run: vp install --frozen-lockfile
      - run: vp exec pluxel workspace setup
      - run: vp run --concurrency-limit=2 workspace:verify
