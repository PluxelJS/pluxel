[tools]
node = "24.21.0"
pnpm = "11.28.2"
hk = "2.6.0"
viteplus = "1.2.0"

[env]
_.path = ["node_modules/.bin"]
PNPM_CONFIG_PM_ON_FAIL = "ignore"

[tasks.setup]
run = ["vp install", "vp exec pluxel workspace setup"]

[tasks."hooks:install"]
run = "hk install --mise"

[tasks.check]
run = "hk check"

[tasks.fix]
run = "hk fix"

[tasks.verify]
run = "vp run verify"
