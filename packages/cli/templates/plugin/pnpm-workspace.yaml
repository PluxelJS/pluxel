packages:
  - .

catalog:
  vite-plus: 1.3.0
  '@pluxel/cli': ^1.1.0
  '@pluxel/core': ^1.1.0
  '@pluxel/rolldown': ^1.1.0
  '@pluxel/test': ^1.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  valibot: ^1.5.0
  typebox: ^1.4.2

allowBuilds:
  esbuild: true
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.3.0
  typebox: 'catalog:'

# Vite+ Core uses its own version while bundling the compatible Vite engine.
peerDependencyRules:
  allowedVersions:
    vite: 1.3.0
